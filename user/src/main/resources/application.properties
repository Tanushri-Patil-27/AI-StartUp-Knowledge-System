spring.application.name=user


server.port=8086

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/AIuser
spring.datasource.username=root
spring.datasource.password=Java@890

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================

jwt.secret=YOUR_VERY_LONG_SECRET_KEY_HERE_123456789
jwt.expiration=86400000
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:}
INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:}
INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:}
INITIAL_ADMIN_ORGANIZATION_ID=${INITIAL_ADMIN_ORGANIZATION_ID:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true