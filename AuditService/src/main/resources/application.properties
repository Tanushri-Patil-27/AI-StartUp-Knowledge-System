spring.application.name=AuditService

server.port=8086


# ===============================
# MYSQL
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/audit
spring.datasource.username=root
spring.datasource.password=Pass123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===============================
# EUREKA
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ===============================
# KAFKA
# ===============================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=audit-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.startupmemory.auditservice.event

spring.kafka.consumer.properties.spring.json.value.default.type=com.startupmemory.auditservice.event.AuditEvent


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
