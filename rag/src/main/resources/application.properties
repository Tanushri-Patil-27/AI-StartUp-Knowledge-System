 
spring.application.name=ai-rag-service

server.port=8088

 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

 
# Gemini API key is loaded from Windows environment variable
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini chat model
spring.ai.google.genai.chat.model=gemini-2.5-flash

 
# Gemini embedding API key
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Gemini text embedding model
spring.ai.google.genai.embedding.text.model=text-embedding-004




spring.ai.vectorstore.qdrant.host=localhost

spring.ai.vectorstore.qdrant.port=6334

spring.ai.vectorstore.qdrant.collection-name=startup_knowledge

spring.ai.vectorstore.qdrant.use-tls=false

spring.ai.vectorstore.qdrant.initialize-schema=true

 

spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:YOUR_VERY_LONG_SECRET_KEY_HERE_123456789}

jwt.secret=${JWT_SECRET:YOUR_VERY_LONG_SECRET_KEY_HERE_123456789}


 

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always


 

logging.level.com.ai.rag=INFO

logging.level.org.springframework.ai=INFO