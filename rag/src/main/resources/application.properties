spring.application.name=ai-rag-service
server.port=8088


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# API key is taken from PowerShell environment variable
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model
spring.ai.openai.chat.options.model=gpt-4o-mini

# Embedding model
spring.ai.openai.embedding.options.model=text-embedding-3-small


# =========================================================
# QDRANT VECTOR DATABASE
# =========================================================

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334

spring.ai.vectorstore.qdrant.collection-name=startup_knowledge

spring.ai.vectorstore.qdrant.use-tls=false

spring.ai.vectorstore.qdrant.initialize-schema=true

# Must be the same JWT secret used by User Service
# JWT
spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:YOUR_VERY_LONG_SECRET_KEY_HERE_123456789}

jwt.secret=${JWT_SECRET:YOUR_VERY_LONG_SECRET_KEY_HERE_123456789}

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

logging.level.com.ai.rag=INFO
logging.level.org.springframework.ai=INFO
