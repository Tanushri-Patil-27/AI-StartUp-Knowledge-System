spring.application.name=APIGateway


server.port=8080

# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================================================
# JWT
# =========================================================

jwt.secret=YOUR_VERY_LONG_SECRET_KEY_HERE_123456789

# =========================================================
# SPRING CLOUD GATEWAY
# =========================================================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/invitations/**

spring.cloud.gateway.server.webflux.routes[1].id=organization-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://OrganizationService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/organizations/**